<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سبد خرید | Shopx<title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

 <header class="premium-header">

    <!-- ردیف اول -->
    <div class="top-header">

        <a href="index.html" class="premium-logo">
           Shop<span>x</span>
        </a>

        <div class="header-search">
            <input type="text" placeholder="جست‌وجوی محصولات...">
            <button type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="header-actions">

            <a href="login.html" class="header-login">
                <i class="fa-regular fa-user"></i>
                ورود / ثبت‌نام
            </a>

            <a href="cart.html" class="premium-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>سبد خرید</span>
                <b class="cart-count">۰</b>
            </a>

        </div>

    </div>

    <!-- ردیف دوم -->
    <nav class="bottom-header">

        <a href="index.html">خانه</a>

        <details class="nav-dropdown">
            <summary>
                دسته‌بندی محصولات
                <i class="fa-solid fa-chevron-down"></i>
            </summary>

            <div class="dropdown-menu">
                <a href="products.html?category=mobile">موبایل</a>
                <a href="products.html?category=laptop">لپ‌تاپ</a>
                <a href="products.html?category=watch">ساعت هوشمند</a>
                <a href="products.html?category=accessory">لوازم جانبی</a>
                <a href="products.html">مشاهده همه محصولات</a>
            </div>
        </details>

        <details class="nav-dropdown">
            <summary>
                برندها
                <i class="fa-solid fa-chevron-down"></i>
            </summary>

            <div class="dropdown-menu">
                <a href="products.html">سامسونگ</a>
                <a href="products.html">اپل</a>
                <a href="products.html">ایسوس</a>
                <a href="products.html">شیائومی</a>
            </div>
        </details>

        <details class="nav-dropdown">
            <summary>
                خدمات
                <i class="fa-solid fa-chevron-down"></i>
            </summary>

            <div class="dropdown-menu">
                <a href="about.html">ضمانت محصولات</a>
                <a href="about.html">پشتیبانی خرید</a>
                <a href="about.html">راهنمای خرید</a>
            </div>
        </details>

        <a href="about.html">درباره ما</a>
        <a href="about.html#contact">تماس با ما</a>

    </nav>

</header>
<main class="cart-page">

    <div class="container">

        <div class="cart-heading">
            <span>خرید آسان و مطمئن</span>
            <h1>سبد خرید شما</h1>
            <p>محصولات انتخاب‌شده خود را بررسی کنید.</p>
        </div>

        <div class="cart-layout">

            <section class="cart-products">

                <div id="cart-items">
                    <!-- محصولات سبد خرید -->
                </div>

                <div id="empty-cart" hidden>
                    <i class="fa-solid fa-basket-shopping"></i>
                    <h2>سبد خرید شما خالی است!</h2>
                    <p>هنوز محصولی به سبد خرید اضافه نکرده‌اید.</p>

                    <a href="products.html">
                        مشاهده محصولات
                    </a>
                </div>

            </section>

            <aside class="cart-summary">

                <h2>خلاصه سفارش</h2>

                <div class="summary-row">
                    <span>تعداد محصولات</span>
                    <strong id="cart-total-count">0</strong>
                </div>

                <div class="summary-row">
                    <span>مبلغ محصولات</span>
                    <strong id="cart-subtotal">0 تومان</strong>
                </div>

                <div class="summary-row">
                    <span>هزینه ارسال</span>
                    <strong>محاسبه در مرحله بعد</strong>
                </div>

                <div class="summary-total">
                    <span>مبلغ قابل پرداخت</span>
                    <strong id="cart-total">0 تومان</strong>
                </div>

                <button id="checkout-button" disabled>
                    ادامه فرایند خرید
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <p class="cart-secure">
                    <i class="fa-solid fa-shield-halved"></i>
                    پرداخت امن و مطمئن
                </p>

            </aside>

        </div>

    </div>

</main>

<footer class="premium-footer">

    <div class="footer-main">

        <!-- معرفی فروشگاه -->
        <div class="footer-about">
            <a href="index.html" class="footer-logo">
                Digi<span>Shop</span>
            </a>

            <p>
                تجربه‌ای متفاوت از خرید محصولات دیجیتال؛
                انتخابی هوشمندانه برای زندگی مدرن.
            </p>

            <div class="footer-socials">
                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Telegram">
                    <i class="fa-brands fa-telegram"></i>
                </a>

                <a href="#" aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

                <a href="#" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>
            </div>
        </div>

        <!-- دسترسی سریع -->
        <div class="footer-column">
            <h3>دسترسی سریع</h3>
            <a href="index.html">صفحه اصلی</a>
            <a href="products.html">فروشگاه محصولات</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
        </div>

        <!-- خدمات مشتریان -->
        <div class="footer-column">
            <h3>خدمات مشتریان</h3>
            <a href="products.html">راهنمای خرید</a>
            <a href="cart.html">سبد خرید</a>
            <a href="checkout.html">ثبت سفارش</a>
            <a href="contact.html">پشتیبانی</a>
        </div>

        <!-- اطلاعات -->
        <div class="footer-column">
            <h3>چرا DigiShop؟</h3>
            <p>انتخاب آسان محصولات دیجیتال</p>
            <p>تجربه خرید ساده و سریع</p>
            <p>توجه به کیفیت و رضایت مشتری</p>
        </div>

    </div>

    <div class="footer-bottom">
        <p>© تمامی حقوق این وب‌سایت متعلق به Shopx است.</p>

        <span>
            Designed with
            <i class="fa-solid fa-heart"></i>
            by Shopx
        </span>
    </div>

</footer>
<script src="js/cart.js"></script><script src="js/cart-count.js"></script>

</body>
</html>
